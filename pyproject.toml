[project]
name = "london-property-demand-forecast"
version = "0.1.0"
description = "Предсказание общего спроса на недвижимость в районах Лондона"
readme = "README.md"
authors = [
    { name = "Sushkov Maksim" },
    { name = "Lebedev Vladimir" },
    { name = "Makarov Kirill" },
    { name = "Ovchinnikov Petr" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lpdf"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.1",
]
notebooks = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
]
